version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: rqc_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: ranquickcalls
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: rqc_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: rqc_backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - redis
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/ranquickcalls?authSource=admin
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRE: 7d
      NODE_ENV: production
      CORS_ORIGIN: http://localhost,http://localhost:3000

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: rqc_client
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
